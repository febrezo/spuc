name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt (check)
        run: cargo fmt --check

      - name: Cargo check
        run: cargo check -q

      - name: Build server binaries for integration tests
        run: cargo build -q -p spuc-server --bins

      - name: Cargo test
        run: cargo test -q
