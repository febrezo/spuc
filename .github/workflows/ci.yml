name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt (check)
        run: cargo fmt --check

      - name: Cargo check
        run: cargo check -q

      - name: Cargo test
        run: cargo test -q
