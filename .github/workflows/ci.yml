name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: 1 - Static quality gates (fmt + clippy + docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt (check)
        run: make fmt-check

      - name: Cargo clippy
        run: make clippy

      - name: Cargo doc (no deps)
        run: make doc

  tests:
    name: 2 - Test suite (unit + integration)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run test suite
        run: make test

  package-check:
    name: 3 - Package and publish dry-run
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo package (spuc-core)
        run: cargo package -p spuc-core --allow-dirty

      - name: Cargo publish dry-run (spuc-core)
        run: cargo publish -p spuc-core --dry-run --allow-dirty

  desktop-linux:
    name: 3 - Desktop Linux build and tests
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libgtk-3-dev

      - name: Cargo test (spuc-gui)
        run: make test-gui

      - name: Build release desktop and CLI binaries
        run: |
          cargo build --release -q -p spuc-cli --bin spuc
          cargo build --release -q -p spuc-gui

      - name: Verify release bundle contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          OUT="dist/spuc-v${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "${OUT}"
          cp target/release/spuc "${OUT}/"
          cp target/release/spuc-gui "${OUT}/"
          test -x "${OUT}/spuc"
          test -x "${OUT}/spuc-gui"

  docker-smoke:
    name: 3 - Docker smoke test
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t spuc:ci .

      - name: Start container and wait for health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name spuc-ci -p 18090:8090 spuc:ci web --host 0.0.0.0 --port 8090 --admin-user admin --admin-password ci-pass-123 --no-open
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:18090/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs spuc-ci
          echo "Container failed health check" >&2
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker logs spuc-ci || true

  security-audit:
    name: 3 - Security audit
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  browser-e2e:
    name: 3 - Chromium browser navigation and CRUD (isolated)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build isolated Chromium QA image
        run: docker compose -f tests/browser/compose.yaml build qa

      - name: Run browser navigation and CRUD against synthetic SPUC data
        run: docker compose -f tests/browser/compose.yaml run --rm --no-deps qa

      - name: Remove isolated QA containers and local image
        if: always()
        run: docker compose -f tests/browser/compose.yaml down --rmi local --remove-orphans || true
