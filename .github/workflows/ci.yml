name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-quality:
    name: Rust Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo fmt (check)
        run: cargo fmt --check

      - name: Cargo clippy (default members)
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test

      - name: Cargo doc (no deps)
        run: cargo doc --no-deps

      - name: Cargo package (spuc-core)
        run: cargo package -p spuc-core --allow-dirty

      - name: Cargo publish dry-run (spuc-core)
        run: cargo publish -p spuc-core --dry-run --allow-dirty

  integration-jsonrpc:
    name: Integration Tests (JSON-RPC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run JSON-RPC integration tests
        run: cargo test --test jsonrpc_cli

  desktop-linux:
    name: Desktop Linux Build and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libgtk-3-dev

      - name: Cargo test (spuc-gui)
        run: cargo test -q -p spuc-gui

      - name: Build release desktop and CLI binaries
        run: |
          cargo build --release -q -p spuc-cli --bin spuc --bin spuc-agent
          cargo build --release -q -p spuc-gui

      - name: Verify release bundle contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'\"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          OUT="dist/spuc-v${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "${OUT}"
          cp target/release/spuc "${OUT}/"
          cp target/release/spuc-agent "${OUT}/"
          cp target/release/spuc-gui "${OUT}/"
          test -x "${OUT}/spuc"
          test -x "${OUT}/spuc-agent"
          test -x "${OUT}/spuc-gui"

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t spuc:ci .

      - name: Start container and wait for health
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name spuc-ci -p 18090:8090 spuc:ci web --host 0.0.0.0 --port 8090 --admin-user admin --admin-password ci-pass-123 --no-open
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:18090/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs spuc-ci
          echo "Container failed health check" >&2
          exit 1

      - name: Print container logs on failure
        if: failure()
        run: docker logs spuc-ci || true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
