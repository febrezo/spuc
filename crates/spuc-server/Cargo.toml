[package]
name = "spuc-server"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "spuc"
path = "src/main.rs"

[[bin]]
name = "spuc-agent"
path = "../../src/emulation/agents/spuc_agent_cli.rs"

[dependencies]
spuc = { package = "spuc-core", path = "../.." }
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
serde_json = "1.0.145"
