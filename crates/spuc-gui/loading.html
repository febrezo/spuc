<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPUC</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d17;
      --panel: rgba(17, 28, 46, 0.78);
      --line: rgba(128, 163, 216, 0.22);
      --text: #dce7fb;
      --muted: #8ea2c4;
      --primary: #4d8dff;
      --cyan: #3fd5e0;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1.2px 1.2px at 12% 22%, rgba(191, 219, 255, 0.34), transparent 100%),
        radial-gradient(1px 1px at 74% 18%, rgba(187, 247, 255, 0.28), transparent 100%),
        radial-gradient(42rem 30rem at 8% -8%, rgba(77, 141, 255, 0.2), transparent 55%),
        radial-gradient(35rem 24rem at 100% 0, rgba(63, 213, 224, 0.18), transparent 58%),
        linear-gradient(180deg, var(--bg) 0%, #070b14 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background:
        radial-gradient(68rem 68rem at 86% 14%, transparent 67%, rgba(142, 162, 196, 0.18) 68%, transparent 69%),
        radial-gradient(52rem 52rem at 12% 84%, transparent 72%, rgba(142, 162, 196, 0.14) 73%, transparent 74%);
    }

    .loading-shell {
      position: relative;
      z-index: 1;
      width: min(92vw, 420px);
      min-height: 340px;
      display: grid;
      place-items: center;
      gap: 18px;
      padding: 42px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(2, 8, 20, 0.55);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .brand img {
      width: 156px;
      height: 156px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0;
      font-weight: 700;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(142, 162, 196, 0.24);
      border-top-color: var(--cyan);
      border-right-color: var(--primary);
      animation: spin 0.9s linear infinite;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="loading-shell" aria-live="polite">
    <section class="brand">
      <img src="icons/icon.png" alt="SPUC logo">
      <h1>SPUC</h1>
      <div class="spinner" aria-hidden="true"></div>
    </section>
    <p>Starting local workspace...</p>
  </main>
</body>
</html>
