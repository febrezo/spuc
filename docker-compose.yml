services:
  spuc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SPUC_IMAGE:-ghcr.io/febrezo/spuc:latest}
    container_name: spuc
    restart: unless-stopped
    ports:
      - "${SPUC_BIND_ADDRESS:-127.0.0.1}:${SPUC_HOST_PORT:-8090}:8090"
    environment:
      SPUC_CONFIG_DIR: /data
      SPUC_WEB_GOOGLE_CLIENT_ID: "${SPUC_WEB_GOOGLE_CLIENT_ID:-}"
      SPUC_WEB_GOOGLE_CLIENT_SECRET: "${SPUC_WEB_GOOGLE_CLIENT_SECRET:-}"
      SPUC_WEB_GOOGLE_REDIRECT_URI: "${SPUC_WEB_GOOGLE_REDIRECT_URI:-}"
      SPUC_WEB_GITHUB_CLIENT_ID: "${SPUC_WEB_GITHUB_CLIENT_ID:-}"
      SPUC_WEB_GITHUB_CLIENT_SECRET: "${SPUC_WEB_GITHUB_CLIENT_SECRET:-}"
      SPUC_WEB_GITHUB_REDIRECT_URI: "${SPUC_WEB_GITHUB_REDIRECT_URI:-}"
      SIGMA_RPC_URL: "${SIGMA_RPC_URL:-}"
      SPUC_SIGMA_RPC_TOKEN: "${SPUC_SIGMA_RPC_TOKEN:-}"
      SPUC_ADMIN_API_TOKEN: "${SPUC_ADMIN_API_TOKEN:-}"
      SPUC_ADMIN_API_TOKEN_NAME: "${SPUC_ADMIN_API_TOKEN_NAME:-Container bootstrap admin token}"
      SPUC_ADMIN_API_TOKEN_EXPIRES_AT: "${SPUC_ADMIN_API_TOKEN_EXPIRES_AT:-}"
    volumes:
      - spuc_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      - web
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --admin-user
      - "${SPUC_ADMIN_USER:-admin}"
      - --admin-password
      - "${SPUC_ADMIN_PASSWORD:?SPUC_ADMIN_PASSWORD is required}"
      - --no-open

volumes:
  spuc_data:
