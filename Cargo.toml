[package]
name = "spuc-core"
version = "0.9.0"
edition = "2021"
autobins = false
description = "Defensive STIX pattern workflow core for SPUC."
license-file = "LICENSE.md"
repository = "https://github.com/febrezo/spuc"

[workspace]
members = [
	".",
	"crates/spuc-cli",
	"crates/spuc-gui",
]
default-members = [
	".",
	"crates/spuc-cli",
]
resolver = "2"

[lib]
name = "spuc"
path = "src/lib.rs"

[features]
default = []
legacy-cli-tests = []

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock"] }
clap = { version = "4.5.60", features = ["derive"] }
open = "5.3.0"
pest = "2.8.6"
pest_derive = "2.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
rustyline = "14.0.0"
sha2 = "0.10.9"
ureq = { version = "2.12.1", default-features = false, features = ["json", "tls"] }

[build-dependencies]
tauri-build = { version = "2.0.3" }
